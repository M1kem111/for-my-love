<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>❤️ Для моего котеночка ❤️</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

  <div class="counter" id="counter"></div>

  <div class="center">

    <div class="heart" id="heart"></div>

    <div class="photo" id="photo">
      <img src="photo.jpg" alt="photo"/>
    </div>

    <button class="btn" id="btn">Наша песня 🎵</button>

  </div>

  <div class="letter" id="letter">
    <div class="letter-content">
      <p>
        Любимая,<br><br>
        Каждый день рядом с тобой делает меня счастливее.<br>
        Ты самое прекрасное, что произошло в моей жизни.<br><br>
        Я всегда буду рядом с тобой, поддерживать тебя и радоваться каждому твоему шагу.<br><br>
        Я очень сильно тебя люблю ❤️
      </p>
    </div>
  </div>

  <audio id="music" src="song.mp3"></audio>

  <script src="script.js"></script>
</body>
</html>
