<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>❤️ Для моего котеночка ❤️</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

  <div class="center">

    <div class="heart fade-in" id="heart"></div>

    <div class="photo fade-in" id="photo">
      <img src="photo.jpg" alt="photo"/>
    </div>

    <button class="btn fade-in" id="btn">Наша песня 🎵</button>

    <div class="counter fade-in" id="counter"></div>

  </div>

  <div class="letter" id="letter">
    <div class="letter-content">
      <p></p>
    </div>
  </div>

  <div class="footer fade-in" style="animation-delay:2.5s;">Дальше только больше... ❤️</div>

  <audio id="music" src="song.mp3"></audio>

  <script src="script.js"></script>
</body>
</html>
