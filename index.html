<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Для тебя Томка ❤️</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

  <div class="center">

    <!-- SVG сердце -->
    <svg class="heart fade-in" id="heart" viewBox="0 0 32 29.6">
      <path d="M23.6,0c-2.9,0-5.4,1.6-7.6,4C13.8,1.6,11.3,0,8.4,0
      C3.8,0,0,3.8,0,8.4c0,9.4,16,21.2,16,21.2s16-11.8,16-21.2
      C32,3.8,28.2,0,23.6,0z"/>
    </svg>

    <div class="photo fade-in" id="photo">
      <img src="photo.jpg" alt="photo"/>
    </div>

    <button class="btn fade-in" id="btn">Наша песня 🎵</button>

    <div class="counter fade-in" id="counter"></div>

  </div>

  <div class="letter" id="letter">
    <div class="letter-content">
      <p></p>
    </div>
  </div>

  <div class="footer fade-in">Дальше только больше... ❤️</div>

  <audio id="music" src="song.mp3"></audio>

  <script src="script.js"></script>
</body>
</html>
